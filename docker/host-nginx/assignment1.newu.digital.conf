# Host Nginx reverse proxy
# Copy to: /etc/nginx/sites-available/assignment1.newu.digital
# Then: ln -s /etc/nginx/sites-available/assignment1.newu.digital /etc/nginx/sites-enabled/
#
# Docker: frontend :3000, API nginx :8000

server {
    listen 80;
    listen [::]:80;
    server_name assignment1.newu.digital;

    client_max_body_size 20M;

    # Laravel API (docker compose nginx → PHP-FPM)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
    }

    # Laravel health (optional)
    location = /up {
        proxy_pass http://127.0.0.1:8000/up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}
